<div class="col-lg-4">
    <div class="single-cat-widget">
        {% for post in posts %}
        <div class="single-post-list d-flex flex-row align-items-center">
            <div class="thumb">
                <img class="img-fluid" src="{{ post.image.url }}" alt="">
            </div>
            <div class="details">
                <a href="blog-single.html">
                    <h6>{{ post.title }}</h6>
                </a>
                <p>{{ post.created_date }}</p>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

{{posts}}
